<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#003A78">
  <meta name="description" content="Conoce los servicios de Domus Salud y accede a nuestra página web.">
  <meta property="og:title" content="Domus Salud | Portal de acceso">
  <meta property="og:image" content="/assets/logo-domus-salud.png">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <title>Domus Salud | Portal de acceso</title>
  <script>
    // Conservar enlaces de reuniones y formularios enviados ANTES de crear el portal.
    // La portada no recoge tokens, ni los incorpora a estadísticas.
    const p = new URLSearchParams(location.search);
    if (p.has('reunion') || p.get('formulario') === 'paciente') {
      location.replace('/web' + location.search + location.hash);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/portal.css?v=2026-11-05-fase65-portada">
</head>
<body>
  <a class="skip" href="#servicios">Ir al acceso principal</a>
  <nav class="staff-access" aria-label="Accesos del personal Domus Salud">
    <a href="/web?acceso=profesional" data-access="profesional" class="staff-button professional">
      <span class="staff-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a6 6 0 0 0 12 0V3"/><path d="M4 3h4M16 3h4M12 14v3a4 4 0 0 0 8 0v-2"/><circle cx="20" cy="13" r="2"/></svg></span>Profesional
    </a>
    <a href="/web?acceso=administracion" data-access="administracion" class="staff-button administration">
      <span class="staff-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 20 5v6c0 5-3 8.5-8 11-5-2.5-8-6-8-11V5l8-3Z"/><path d="m8.5 12 2.5 2.5 5-5"/></svg></span>Administración
    </a>
  </nav>
  <main class="portal">
    <header class="portal-head">
      <img class="brand-logo" src="/assets/logo-domus-salud.png" alt="Domus Salud. Cuidado clínico en tu hogar" width="142" height="172">
      <p class="eyebrow">BIENVENIDO A DOMUS SALUD</p>
    </header>
    <a class="patient-feature" id="servicios" href="/web?acceso=paciente" data-access="paciente" aria-label="Conoce nuestros servicios. Ir a la página web de Domus Salud">
      <span class="patient-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/><path d="M6 12h3l1.3-2.3 2.5 5 1.6-2.7H18"/></svg></span>
      <h1>CONOCE NUESTROS<br>SERVICIOS</h1>
      <span class="patient-hint">HAZ CLIC PARA CONTINUAR</span>
      <span class="patient-cta">Ir a la página web <span aria-hidden="true">→</span></span>
    </a>
    <footer><img src="/assets/logo-domus-header.png" alt="" width="34" height="42"><span>Domus Salud · Atención domiciliaria</span></footer>
  </main>
  <div class="bottom-waves" aria-hidden="true"><svg viewBox="0 0 1440 190" preserveAspectRatio="none"><path fill="#c7eed5" opacity=".74" d="M0 12C210-10 360 132 630 144C930 158 1180 14 1440 20V190H0Z"/><path fill="#b6e8ef" opacity=".7" d="M0 115C245 65 419 172 745 162C1090 151 1190 72 1440 68V190H0Z"/></svg></div>
  <script src="/js/portal.js?v=2026-11-05-fase65-portada" defer></script>
</body>
</html>
